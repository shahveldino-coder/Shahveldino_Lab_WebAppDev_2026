
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #46579a;
            color: white;
            border: none;
            cursor: pointer;


        } 
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>

</head>

<body>
    <Div class="login container">
       
     <h1> Welcome</h1>
        <p style="color:gray">Please enter your login credentials</p>

<p style="font-weight: bold">Email:</p>
<input type="email" name="email" placeholder="Enter your email" required>

<p style="font-weight: bold">Password:</p>
<input type="password" name="password" placeholder="Enter your password" required>  
<a href="#">Forgot Password?</a>
<br>
<br>
<input type="checkbox" name="remember" value="yes"> Im not a robot 
<br>
<br>
<button type="submit">Sign In</button>


</div>
</body>
