<!DOCTYPE html>
<html>
<head>
    <title>The Code Magazine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        /* HEADER */
        header {
            background-color: #e7e4e4;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            color: rgb(0, 0, 201);
        }

        nav a {
            margin-right: 20px;
            text-decoration: none;
            color: #5d00ff;
        }

        nav a:hover {
            color: #449eff;
        }

        /* CONTAINER ISI */
        .container {
            display: flex;
            gap: 50px;
            margin-top: 30px;
            align-items: flex-start;
        }

        /* BAGIAN KIRI */
        .main-content {
            width: 65%;
        }

        .main-content h1 {
            color: rgb(20, 20, 233);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .profile img {
            width: 50px;
            height: 50px;
            
        }

        .main-image {
            width: 100%;
            height: auto;
        }

        /* BAGIAN KANAN */
        .sidebar {
            width: 35%;
            background-color: #f2f2f2;
            padding: 20px;
            border-top: 5px solid #087f8c;
            border-bottom: 5px solid #087f8c;
        }

        .sidebar h2 {
            color: #087f8c;
            text-align: center;
            margin-bottom: 30px;
        }

        /* LIST ARTIKEL */
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .article {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .article img {
            width: 120px;
            height: 80px;
            object-fit: cover;
        }

        .article-info h3 {
            color: #087f8c;
            font-size: 20px;
            margin: 0 0 10px 0;
        }

        .article-info p {
            font-size: 16px;
            font-style: italic;
            margin: 0;
            color: #555;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>📘 The Code Magazine</h1>

        <nav>
            <a href="#">Blog</a>
            <a href="#">Challenge</a>
            <a href="#">Flex Box</a>
            <a href="#">CSS Grid</a>
        </nav>
    </header>


    
    <div class="container">

        
        <main class="main-content">

            <h1>The Basic Language of the Web: HTML</h1>

            <div class="profile">
                <img src="https://claudionoggueira.github.io/code-magazine/img/laura-jones.jpg"
                     alt="Laura Jones">

                <p>Post by Laura Jones on Monday, June 21st</p>
            </div>

            <img class="main-image"
                 src="https://claudionoggueira.github.io/code-magazine/img/post-img.jpg"
                 alt="HTML Image">

        </main>


    
        <aside class="sidebar">

            <h2>RELATED POSTS</h2>

            <div class="article-list">

               
                <div class="article">
                    <img src="https://claudionoggueira.github.io/code-magazine/img/related-1.jpg"
                         alt="Related Post">

                    <div class="article-info">
                        <h3>How to Learn Web Development</h3>
                        <p>By Jonas Schneidtmann</p>
                    </div>
                </div>


                
                <div class="article">
                    <img src="https://claudionoggueira.github.io/code-magazine/img/related-2.jpg"
                         alt="Related Post">

                    <div class="article-info">
                        <h3>The Unknown Powers of CSS</h3>
                        <p>By Jim Dillon</p>
                    </div>
                </div>


                <div class="article">
                    <img src="https://claudionoggueira.github.io/code-magazine/img/related-3.jpg"
                         alt="Related Post">

                    <div class="article-info">
                        <h3>Why JavaScript is Awesome</h3>
                        <p>By Matilda</p>
                    </div>
                </div>

            </div>

        </aside>

    </div>

</body>
</html>
